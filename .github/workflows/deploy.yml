name: Deploy to Production Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
      
      - name: Diagnose Connection
        run: |
          echo "=========================================="
          echo "Connection Diagnostics"
          echo "=========================================="
          echo "Server Host: ${{ secrets.SERVER_HOST }}"
          echo "Server User: ${{ secrets.SERVER_USER }}"
          echo ""
          echo "Testing basic connectivity..."
          
          # Test ping (may fail if ICMP is blocked, but worth trying)
          if ping -c 3 -W 5 ${{ secrets.SERVER_HOST }} > /dev/null 2>&1; then
            echo "✓ Server is reachable via ping"
          else
            echo "⚠️  Server is not reachable via ping (ICMP may be blocked)"
          fi
          
          # Test port 22
          echo "Testing port 22..."
          if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.SERVER_HOST }}/22" 2>/dev/null; then
            echo "✓ Port 22 is open"
          else
            echo "❌ Port 22 is not accessible"
            echo "Possible causes:"
            echo "  - Firewall is blocking port 22"
            echo "  - SSH service is not running on server"
            echo "  - Server is down or unreachable"
            echo "  - Network connectivity issues"
          fi
          
          # Test DNS resolution
          echo "Testing DNS resolution..."
          if host ${{ secrets.SERVER_HOST }} > /dev/null 2>&1; then
            echo "✓ DNS resolution successful"
          else
            echo "⚠️  DNS resolution failed (may be IP address)"
          fi
          
          echo ""
          echo "=========================================="
      
      - name: Test SSH Connection with Retry
        id: ssh_test
        continue-on-error: true
        timeout-minutes: 10
        run: |
          echo "Testing SSH connection..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          RETRY_DELAY=15
          
          # Test raw TCP connection first
          echo "Testing raw TCP connection to port 22..."
          if timeout 10 bash -c "echo > /dev/tcp/${{ secrets.SERVER_HOST }}/22" 2>/dev/null; then
            echo "✓ Port 22 is reachable"
          else
            echo "⚠️  Port 22 is not reachable via TCP"
          fi
          
          # Create SSH config for better connection handling
          # Simplified config without ControlMaster (can cause issues)
          cat > ~/.ssh/config << EOF
          Host ${{ secrets.SERVER_HOST }}
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 60
            ServerAliveInterval 20
            ServerAliveCountMax 10
            TCPKeepAlive yes
            BatchMode yes
            PreferredAuthentications publickey
            # Compression for slow connections
            Compression yes
            # Faster cipher algorithms
            Ciphers aes128-ctr,aes192-ctr,aes256-ctr
            MACs hmac-sha2-256,hmac-sha2-512
            # Disable GSSAPI for faster connection
            GSSAPIAuthentication no
            GSSAPIDelegateCredentials no
            # Disable other slow features
            KbdInteractiveAuthentication no
            PasswordAuthentication no
            # Increase login grace time
            LoginGraceTime 60
          EOF
          chmod 600 ~/.ssh/config
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo ""
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            echo "Connecting to ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}..."
            
            # Test connection with increased timeout (60s connect + 10s command)
            if timeout 70 ssh -v ${{ secrets.SERVER_HOST }} \
              "echo 'SSH connection successful'" 2>&1 | tee /tmp/ssh_output.log; then
              echo ""
              echo "✓ SSH connection established successfully!"
              echo "connected=true" >> $GITHUB_OUTPUT
              exit 0
            else
              SSH_EXIT_CODE=$?
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              echo ""
              echo "⚠️  Connection failed (exit code: $SSH_EXIT_CODE)"
              
              # Show last few lines of SSH output for debugging
              if [ -f /tmp/ssh_output.log ]; then
                echo "Last SSH output:"
                tail -20 /tmp/ssh_output.log || true
              fi
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Retrying in ${RETRY_DELAY}s..."
                echo "This might be due to:"
                echo "  - Network latency or packet loss"
                echo "  - Server load (high CPU/memory usage)"
                echo "  - SSH service response time"
                echo "  - Firewall or network restrictions"
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY + 10))
              fi
            fi
          done
          
          echo ""
          echo "❌ SSH connection failed after $MAX_RETRIES attempts"
          echo ""
          echo "=========================================="
          echo "Troubleshooting Information"
          echo "=========================================="
          echo ""
          echo "Server: ${{ secrets.SERVER_HOST }}"
          echo "User: ${{ secrets.SERVER_USER }}"
          echo ""
          echo "Please check on the server:"
          echo ""
          echo "1. SSH Service Status:"
          echo "   sudo systemctl status ssh"
          echo "   sudo systemctl restart ssh"
          echo ""
          echo "2. Firewall:"
          echo "   sudo ufw status"
          echo "   sudo ufw allow 22/tcp"
          echo ""
          echo "3. SSH Config:"
          echo "   sudo nano /etc/ssh/sshd_config"
          echo "   # Add/check these settings:"
          echo "   # MaxStartups 10:30:100"
          echo "   # LoginGraceTime 60"
          echo "   # UseDNS no"
          echo "   sudo systemctl reload ssh"
          echo ""
          echo "4. Server Load:"
          echo "   uptime"
          echo "   top"
          echo ""
          echo "5. SSH Logs:"
          echo "   sudo tail -50 /var/log/auth.log"
          echo ""
          echo "6. Port 22:"
          echo "   sudo netstat -tuln | grep 22"
          echo "   sudo ss -tuln | grep 22"
          echo ""
          echo "=========================================="
          echo "connected=false" >> $GITHUB_OUTPUT
      
      - name: Deploy to server
        if: steps.ssh_test.outputs.connected == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        timeout-minutes: 40
        run: |
          SERVER_PATH="${{ secrets.SERVER_PATH }}"
          
          # Use SSH with optimized settings and keep connection alive
          ssh -o ConnectTimeout=60 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=30 \
              -o TCPKeepAlive=yes \
              ${{ secrets.SERVER_HOST }} \
            "cd '$SERVER_PATH' && bash -s" << 'DEPLOY_SCRIPT'
          set -e
          set -o pipefail
          
          echo "=========================================="
          echo "Starting optimized deployment..."
          echo "=========================================="
          
          echo "Pulling latest code..."
          git fetch origin --quiet || true
          git reset --hard origin/main || git reset --hard origin/master || true
          
          echo "Deploying services..."
          cd backend || { echo "❌ Failed to cd to backend directory"; exit 1; }
          
          # Verify docker-compose file exists
          if [ ! -f docker-compose.prod.yml ]; then
            echo "❌ docker-compose.prod.yml not found!"
            exit 1
          fi
          
          # Quick cleanup - only stop containers, don't remove (faster)
          echo "Stopping existing containers..."
          docker compose -f docker-compose.prod.yml stop || true
          
          # Build with cache (much faster)
          echo "Building containers with cache..."
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          export COMPOSE_BAKE=true
          export COMPOSE_HTTP_TIMEOUT=1800
          export DOCKER_CLIENT_TIMEOUT=1800
          export BUILDKIT_PROGRESS=plain
          
          # Use global --progress flag (correct way)
          COMPOSE_PROGRESS=plain
          
          # Build backend and frontend sequentially with cache
          echo "Building backend..."
          docker compose --progress=plain -f docker-compose.prod.yml build backend || {
            echo "⚠️  Build with cache failed, trying without cache..."
            docker compose --progress=plain -f docker-compose.prod.yml build --no-cache backend
          }
          
          echo "Building frontend (this may take 10-15 minutes)..."
          echo "Note: Next.js build can take time, please be patient..."
          echo "Build started at: $(date)"
          
          # Frontend build with optimizations
          # Set build args for faster builds
          # Increase Docker build timeout
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          export COMPOSE_BAKE=true
          export COMPOSE_HTTP_TIMEOUT=2400
          export DOCKER_CLIENT_TIMEOUT=2400
          
          docker compose --progress=plain -f docker-compose.prod.yml build \
            --build-arg SKIP_ENV_VALIDATION=true \
            frontend || {
            echo "⚠️  Build with cache failed, trying without cache..."
            echo "Retry started at: $(date)"
            docker compose --progress=plain -f docker-compose.prod.yml build \
              --no-cache \
              --build-arg SKIP_ENV_VALIDATION=true \
              frontend
          }
          
          echo "Build completed at: $(date)"
          
          echo "Starting containers..."
          docker compose --progress=plain -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
          
          echo "Waiting for services to be ready..."
          sleep 2
          
          echo "Checking service status..."
          docker compose --progress=plain -f docker-compose.prod.yml ps || true
          
          # Nginx fix is optional and can be done separately if needed
          # Skipping to save time during deployment
          
          echo "Testing services..."
          BACKEND_READY=false
          FRONTEND_READY=false
          
          # Quick health check (5 attempts, 2s delay = 10s max)
          for i in {1..5}; do
              if curl -s -f http://127.0.0.1:3000/health > /dev/null 2>&1; then
                  echo "✓ Backend is responding"
                  BACKEND_READY=true
                  break
              fi
              [ $i -eq 5 ] && echo "⚠️  Backend not responding after 5 attempts" || sleep 2
          done
          
          for i in {1..5}; do
              if curl -s -f http://127.0.0.1:3001 > /dev/null 2>&1; then
                  echo "✓ Frontend is responding"
                  FRONTEND_READY=true
                  break
              fi
              [ $i -eq 5 ] && echo "⚠️  Frontend not responding after 5 attempts" || sleep 2
          done
          
          echo ""
          echo "=========================================="
          if [ "$BACKEND_READY" = true ] && [ "$FRONTEND_READY" = true ]; then
              echo "✓ Deployment complete! All services are running."
          else
              echo "⚠️  Deployment completed. Services may still be starting."
              echo "Backend ready: $BACKEND_READY"
              echo "Frontend ready: $FRONTEND_READY"
              echo ""
              echo "Note: Services may need a few more seconds to fully start."
              echo "Check logs with: docker compose -f docker-compose.prod.yml logs"
          fi
          echo "=========================================="
          DEPLOY_SCRIPT
      
      - name: Health Check
        if: steps.ssh_test.outputs.connected == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        timeout-minutes: 2
        run: |
          echo "Waiting for services to start..."
          sleep 5
          echo "Checking API health..."
          curl -f --max-time 10 http://${{ secrets.SERVER_HOST }}/health || echo "⚠️  Health check failed, but deployment may still be in progress"

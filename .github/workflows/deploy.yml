name: Deploy to Production Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts
      
      - name: Diagnose Connection
        run: |
          echo "=========================================="
          echo "Connection Diagnostics"
          echo "=========================================="
          echo "Server Host: ${{ secrets.SERVER_HOST }}"
          echo "Server User: ${{ secrets.SERVER_USER }}"
          echo ""
          echo "Testing basic connectivity..."
          
          # Test ping (may fail if ICMP is blocked, but worth trying)
          if ping -c 3 -W 5 ${{ secrets.SERVER_HOST }} > /dev/null 2>&1; then
            echo "✓ Server is reachable via ping"
          else
            echo "⚠️  Server is not reachable via ping (ICMP may be blocked)"
          fi
          
          # Test port 22
          echo "Testing port 22..."
          if timeout 5 bash -c "echo > /dev/tcp/${{ secrets.SERVER_HOST }}/22" 2>/dev/null; then
            echo "✓ Port 22 is open"
          else
            echo "❌ Port 22 is not accessible"
            echo "Possible causes:"
            echo "  - Firewall is blocking port 22"
            echo "  - SSH service is not running on server"
            echo "  - Server is down or unreachable"
            echo "  - Network connectivity issues"
          fi
          
          # Test DNS resolution
          echo "Testing DNS resolution..."
          if host ${{ secrets.SERVER_HOST }} > /dev/null 2>&1; then
            echo "✓ DNS resolution successful"
          else
            echo "⚠️  DNS resolution failed (may be IP address)"
          fi
          
          echo ""
          echo "=========================================="
      
      - name: Test SSH Connection with Retry
        id: ssh_test
        continue-on-error: true
        timeout-minutes: 5
        run: |
          echo "Testing SSH connection..."
          MAX_RETRIES=5
          RETRY_COUNT=0
          RETRY_DELAY=10
          
          # Create SSH config for better connection handling
          cat > ~/.ssh/config << EOF
          Host ${{ secrets.SERVER_HOST }}
            HostName ${{ secrets.SERVER_HOST }}
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 6
            TCPKeepAlive yes
            BatchMode yes
            PreferredAuthentications publickey
            # Increase timeout for banner exchange
            ControlMaster auto
            ControlPath ~/.ssh/control-%h-%p-%r
            ControlPersist 5m
            # Compression for slow connections
            Compression yes
            # Faster cipher algorithms
            Ciphers aes128-ctr,aes192-ctr,aes256-ctr
            MACs hmac-sha2-256,hmac-sha2-512
            # Disable DNS lookup for faster connection
            GSSAPIAuthentication no
            UseDNS no
          EOF
          chmod 600 ~/.ssh/config
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES..."
            
            # Test connection with timeout
            if timeout 45 ssh ${{ secrets.SERVER_HOST }} \
              "echo 'SSH connection successful'" 2>&1; then
              echo "✓ SSH connection established"
              echo "connected=true" >> $GITHUB_OUTPUT
              exit 0
            else
              SSH_EXIT_CODE=$?
              RETRY_COUNT=$((RETRY_COUNT + 1))
              
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️  Connection failed (exit code: $SSH_EXIT_CODE), retrying in ${RETRY_DELAY}s..."
                echo "This might be due to:"
                echo "  - Network latency"
                echo "  - Server load"
                echo "  - SSH service response time"
                sleep $RETRY_DELAY
                RETRY_DELAY=$((RETRY_DELAY + 5))
              fi
            fi
          done
          
          echo "❌ SSH connection failed after $MAX_RETRIES attempts"
          echo ""
          echo "Troubleshooting steps:"
          echo "1. Check if server is running: ping ${{ secrets.SERVER_HOST }}"
          echo "2. Check if SSH service is running on server: sudo systemctl status ssh"
          echo "3. Check server firewall: sudo ufw status"
          echo "4. Verify SSH key in GitHub Secrets"
          echo "5. Check server load: ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'uptime'"
          echo "6. Check SSH logs on server: sudo tail -f /var/log/auth.log"
          echo ""
          echo "If SSH is not available, you may need to:"
          echo "- Fix SSH service on server"
          echo "- Open port 22 in firewall"
          echo "- Restart SSH service: sudo systemctl restart ssh"
          echo "- Use alternative deployment method"
          echo "connected=false" >> $GITHUB_OUTPUT
      
      - name: Deploy to server
        if: steps.ssh_test.outputs.connected == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
        timeout-minutes: 15
        run: |
          SERVER_PATH="${{ secrets.SERVER_PATH }}"
          
          # Use SSH config for optimized connection
          ssh ${{ secrets.SERVER_HOST }} \
            "cd '$SERVER_PATH' && bash -s" << 'DEPLOY_SCRIPT'
          set -e
          echo "=========================================="
          echo "Starting optimized deployment..."
          echo "=========================================="
          
          echo "Pulling latest code..."
          git fetch origin --quiet
          git reset --hard origin/main || git reset --hard origin/master
          
          echo "Deploying services..."
          cd backend
          
          # Quick cleanup - only stop containers, don't remove (faster)
          echo "Stopping existing containers..."
          docker compose -f docker-compose.prod.yml stop || true
          
          # Build with cache (much faster)
          echo "Building containers with cache..."
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1
          export COMPOSE_BAKE=true
          export COMPOSE_HTTP_TIMEOUT=1800
          export DOCKER_CLIENT_TIMEOUT=1800
          
          # Build backend and frontend sequentially with cache
          echo "Building backend..."
          docker compose -f docker-compose.prod.yml --progress=plain build backend || {
            echo "Build with cache failed, trying without cache..."
            docker compose -f docker-compose.prod.yml --progress=plain build --no-cache backend
          }
          
          echo "Building frontend (this may take 5-10 minutes)..."
          # Frontend build with optimizations
          # Set build args for faster builds
          COMPOSE_HTTP_TIMEOUT=1800 DOCKER_CLIENT_TIMEOUT=1800 \
          docker compose -f docker-compose.prod.yml --progress=plain build \
            --build-arg SKIP_ENV_VALIDATION=true \
            frontend || {
            echo "Build with cache failed, trying without cache..."
            COMPOSE_HTTP_TIMEOUT=2400 DOCKER_CLIENT_TIMEOUT=2400 \
            docker compose -f docker-compose.prod.yml --progress=plain build \
              --no-cache \
              --build-arg SKIP_ENV_VALIDATION=true \
              frontend
          }
          
          echo "Starting containers..."
          docker compose -f docker-compose.prod.yml --progress=plain up -d --force-recreate --remove-orphans
          
          echo "Waiting for services to be ready..."
          sleep 3
          
          echo "Checking service status..."
          docker compose -f docker-compose.prod.yml --progress=plain ps
          
          echo "Fixing Nginx configuration..."
          if [ -f ../scripts/fix-nginx.sh ]; then
              chmod +x ../scripts/fix-nginx.sh
              ../scripts/fix-nginx.sh
          else
              echo "⚠️  Nginx fix script not found, skipping..."
          fi
          
          echo "Testing services..."
          for i in {1..5}; do
              if curl -s -f http://127.0.0.1:3000/health > /dev/null 2>&1; then
                  echo "✓ Backend is responding"
                  break
              fi
              [ $i -eq 5 ] && echo "⚠️  Backend not responding yet" || sleep 1
          done
          
          for i in {1..5}; do
              if curl -s -f http://127.0.0.1:3001 > /dev/null 2>&1; then
                  echo "✓ Frontend is responding"
                  break
              fi
              [ $i -eq 5 ] && echo "⚠️  Frontend not responding yet" || sleep 1
          done
          
          echo ""
          echo "=========================================="
          echo "Deployment complete!"
          echo "=========================================="
          DEPLOY_SCRIPT
      
      - name: Health Check
        if: steps.ssh_test.outputs.connected == 'true'
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        timeout-minutes: 2
        run: |
          echo "Waiting for services to start..."
          sleep 5
          echo "Checking API health..."
          curl -f --max-time 10 http://${{ secrets.SERVER_HOST }}/health || echo "⚠️  Health check failed, but deployment may still be in progress"
